    intrabar_stop: false

# === 单品种历史配置存档 (字段模板备查) ===
#   period: d1            # d1 | h1, 每品种独立选择
#   system: S1            # S1(20/10+盈利跳过+55fail-safe) | S2(55/20)
#   # system: "S1+S2"     # 双系统并行: 各半 units 独立引擎, 净仓合并执行,
#                         # 品种内风险/保证金预算按 units 占比切分 (经典海龟口径)
#   units: 2              # 每层 N × 20万 VaR
#   direction: both       # both | long | short (隐式方向闸)
#   group: black          # 相关性组标签 (配合 risk.max_units_per_group)
#   intrabar_stop: false  # 盘中止损: 主K切为 base.intrabar_period,
#                         # 信号仍按 d1 收盘确认+日期去重; 需 storage 有分钟线
#   # filters: 辅助信号过滤链 (隐式方向闸之后依次判定; 全部放行才入场)
#   # filters:
#   #   - type: AdxTrend        # ADX 趋势强度下限 (震荡市否决)
#   #     params: {period: 14, threshold: 25}
#   #   - type: VolatilityBand  # N 处于近窗分位带内才交易
#   #     params: {window: 250, min_pct: 0.10, max_pct: 0.90}
#   #   - type: LiquidityFloor  # 成交量/持仓量下限
#   #     params: {k: 5, min_volume: 10000}
# 注意: 启用某品种需同时满足
#   1) common/hots.json 含该品种键 (空列表=不换月即可, 缺键 C++ 回放器会崩溃)
#   2) storage 有对应 period 的 K 线数据 (h1 需小时线)
# - code: DCE.i.HOT
#   period: d1
#   system: S2
#   units: 1
#   direction: long       # 只做多: 空头信号禁止开仓
#   group: black
