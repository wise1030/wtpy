basefiles:      #基础文件配置
    commodity: ../common/commodities.json       #品种列表
    contract: ../common/contracts.json          #合约列表
    holiday: ../common/holidays.json            #节假日列表
    hot: ../common/hots.json                    #主力合约映射表
    session: ../common/sessions.json            #交易时间模板
data:
    store:
        module: WtDataStorage                   #数据存储模块
        path: ../storage/                       #数据存储根目录
env:
    name: cta
    fees: ../common/fees.json                   #佣金配置文件
    filters: filters.yaml                       #过滤器(交易时段/涨跌停)
    product:
        session: TRADING                        #交易时段模板
    riskmon:                                    #组合级风控(SimpleRiskMon, C++核心执行)
        # 参数平铺于 riskmon 下 (官方口径, 嵌套 params 层 C++ 读不到
        # → 2026-09-03 实盘日志证实参数全 0 空转)
        active: true
        module: WtRiskMonFact
        name: SimpleRiskMon
        base_amount: 5000000    #组合基础资金(增量+基础=动态权益)
        basic_ratio: 101        #日内高点百分比阈值
        calc_span: 5            #计算间隔(s)
        inner_day_active: true  #日内跟踪止损: 收益从高点回撤 20% 熔断
        inner_day_fd: 20.0
        multi_day_active: false #多日跟踪止损关闭 (策略层 RiskManager 已做预算)
        multi_day_fd: 60.0
        risk_scale: 1.0         #目标仓位缩放 (1.0=不缩放; 缩量由 RiskManager 负责)
        risk_span: 30           #风控日志间隔(s)
executers: executers.yaml                       #执行单元配置
parsers: tdparsers.yaml                         #行情通道配置
traders: tdtraders.yaml                         #交易通道配置
bspolicy: actpolicy.yaml                        #开平策略(先平后开)
notifier:                                       #监控事件推送(WtMonSvr订阅)
    active: true
    url: ipc:///tmp/wt_turtle.ipc               #本机ipc; 监控侧mqurl必须与此完全一致
