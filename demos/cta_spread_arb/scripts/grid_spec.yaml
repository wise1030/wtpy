# v10 parameter grid for cta_spread_arb
# v10: 单instance模式, base_experiment=default(rb_hc_2510_m5)
# 4 workers, sort by calmar.

base_experiment: default
base_config_root: config
sort_key: calmar_ratio

# Parameter names are stable column names in leaderboard.csv.
grid:
  entry_threshold: [0.4, 0.5, 0.6]
  exit_threshold: [0.1, 0.2]
  stop_loss_pct: [0.02, 0.03]
  trend_r2: [0.5, 0.6]
  main_bar_cnt: [100, 200, 400]

filters:
  exit_lt_entry: true

# Mapping from logical grid parameter to v9 config files.
# stop_loss_pct is converted by GridGenerator to max_loss_per_pair = backtest.capital * pct.
parameter_map:
  entry_threshold:
    target: base_signal
    path: signal.entry_threshold
  exit_threshold:
    target: base_signal
    path: signal.exit_threshold
  stop_loss_pct:
    target: base_risk
    path: risk_control.max_loss_per_pair
    transform: capital_pct_to_abs
  trend_r2:
    target: experiment
    path: auto_profile.trend_r2
  main_bar_cnt:
    target: experiment_all_periods
    path: main_bar_cnt
