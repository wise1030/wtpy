# ============================================================
# contracts/l_pp.yaml — l/pp 跨品种套利合约对定义
# 品种: DCE.l(塑料) / DCE.pp(聚丙烯)
# 特征: 同属聚烯烃产业链, 高度相关, 均值回归显著
# 合约规格: pricetick=1, volscale=5 (5吨/手)
# ============================================================

product_pair: l_pp
type: cross_commodity
spread_mode: coint
sector: chemicals           # 产业链板块 (用于矩阵校验: 不同板块不应混跑)
valid_months: ["2609"]      # 该品种对可用的合约月份 (空=全部可用)

legs_template:
  # 正腿(l): 多 l / 空 l 由价差方向决定, ratio=+1
  - symbol: l
    exchange: DCE
    stdCode_template: "DCE.l.{month}"
    ratio: 1
    lots: 1
    multiplier: 5
    fee_fixed: 1.25   # 定额 (元/手)
    ref_price: 8000   # 参考价格 (元/吨)
    tick_size: 1      # 最小变动价位 (元/吨)
  # 反腿(pp): ratio=-1, 与 l 形成跨品种对冲
  - symbol: pp
    exchange: DCE
    stdCode_template: "DCE.pp.{month}"
    ratio: -1
    lots: 1
    multiplier: 5
    fee_fixed: 1.47   # 定额 (元/手)
    ref_price: 7500
    tick_size: 1
