# ============================================================
# profiles/trending_contract.yaml — 趋势单边市场参数覆盖包
# 来源: strategy_config.yaml 的 param_profiles.trending_contract (第64-67行)
# 用途: 应用于强趋势合约 (如 l/pp 2609 — 日线 R²>0.55, 价差持续单边)
# 关键: 提高开仓阈值 + 抑制逆势信号
#
# S1 (2026-06): factor_overrides 已移除。
# 基线3因子 (coint_residual=0.5, half_life=0.2, spread_momentum=0.3)
# 在 l/pp 2609 trending 上已验证 net=+299。
# 新因子/权重调整应走 matrix 实验验证, 不直接改默认 profile。
# ============================================================

name: trending_contract
description: "趋势单边市场: 提高入场门槛, 偏向顺势 SHORT_SPREAD"

overrides:
  signal:
    entry_threshold: 0.60        # 0.45 → 0.60, 过滤弱信号
    short_entry_multiplier: 0.7  # 1.0 → 0.7, 提升 SHORT_SPREAD 通过率(顺势)
