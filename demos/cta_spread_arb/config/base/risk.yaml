# ============================================================
# base/risk.yaml — 风控全局默认参数
# 来源: strategy_config.yaml 的 `risk_control` 段 (第24-31行)
# 用途: 持仓时长、单对最大亏损、止盈回撤等风控参数基线
# ============================================================

risk_control:
  cooldown_bars: 24
  max_hold_bars: 480
  max_loss_per_pair: 5000
  max_spread_deviation: 4.0
  min_hold_bars: 12
  profit_drawdown_ratio: 0.2
  profit_take_threshold: 500
