# ============================================================
# base/execution.yaml — 执行层全局默认参数
# 来源: strategy_config.yaml 的 `execution` 段 (第1-6行)
# 用途: 双腿下单 timeout、Bollinger 触发阈值、最小 bar 长度等
# ============================================================

execution:
  bollinger_lookback: 60
  bollinger_threshold: 2.0
  leg_timeout: 5
  max_retry: 3
  min_bar_length: 20
