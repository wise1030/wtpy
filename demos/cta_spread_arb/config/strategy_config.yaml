# ============================================================
# strategy_config.yaml — [DEPRECATED: 仍为 runBT/runLive 默认入口]
#
# v9 分层配置重构后，各段已拆分至:
#   config/base/execution.yaml   ← execution 段
#   config/base/regime.yaml      ← regime 段
#   config/base/signal.yaml      ← signal 段
#   config/base/risk.yaml        ← risk_control 段
#   config/contracts/rb_hc.yaml  ← strategies + legs
#   config/profiles/*.yaml       ← param_profiles
#
# 本文件保留仅因 runBT.py / runLive.py 以此为默认路径。
# 实验配置 (experiments/*.yaml) 会叠加 base/ 覆盖，本文件仅作 fallback。
# 新增参数请同时更新 config/base/ 对应 yaml, 避免两份漂移。
# ============================================================
execution:
  bollinger_lookback: 60
  bollinger_threshold: 2.0
  leg_timeout: 5
  max_retry: 3
  min_bar_length: 20
regime:
  adx_window: 21
  hurst_window: 60
  mr_hurst_threshold: 0.45
  mr_momentum_weight: 0.7
  mr_reversal_weight: 1.3
  range_momentum_weight: 0.3
  range_neutral_weight: 0.5
  range_reversal_weight: 0.3
  regime_memory_bars: 12
  regime_switch_cost: 0.3
  trend_adx_threshold: 25.0
  trend_hurst_threshold: 0.55
  trend_momentum_weight: 1.3
  trend_reversal_weight: 0.7
  vol_regime_z: 1.0
  vol_window: 60
risk_control:
  cooldown_bars: 24
  max_hold_bars: 480
  max_loss_per_pair: 5000
  max_spread_deviation: 4.0
  min_hold_bars: 12
signal:
  # v7.2-final 基线（适配 mean-reverting 场景，如 rb/hc 2601）
  blocked_hours: '14'
  coint_decay: 0.7
  # v8.1: direction_threshold 已移除（dead 参数）
  entry_threshold: 0.45
  exit_threshold: 0.08
  momentum_decay: 0.7
  pnl_trailing_medium: 0.25
  pnl_trailing_threshold: 100.0
  pnl_trailing_tight: 0.15
  pnl_trailing_wide: 0.35
  profit_protect_floor: 0.4
  profit_protect_peak: 0.9
  range_exit_threshold: 0.4
  short_entry_multiplier: 1.0
  signal_mode: adaptive
  signal_persist_bars: 2
  trailing_decay_ratio: 0.35
  trailing_exit_bars: 4
  trend_counter_decay_factor: 0.5
  trend_trailing_bars: 2
  trend_trailing_ratio: 0.5

# v7.4: 合约级参数 profile
# 用于不同合约月份采用差异化参数（趋势市 vs 震荡市）
param_profiles:
  # 趋势单边市场（如 rb/hc 2510 — 2025 全年价差从 -89 单边跌至 -660）
  # 关键：提高开仓阈值 + 抑制 LONG_SPREAD 方向（逆势开仓亏损源头）
  trending_contract:
    signal:
      entry_threshold: 0.60        # 0.45 → 0.60，过滤弱信号
      short_entry_multiplier: 0.7  # 1.0 → 0.7，提升 SHORT_SPREAD 通过率（顺势）

  # 均值回归市场（rb/hc 价差有显著回归特征的合约月）
  # 与 trending_contract 对偶: 降低 entry_threshold 多捕捉机会, 保持 SHORT 中性
  mr_contract:
    signal:
      entry_threshold: 0.40        # 0.45 → 0.40，多捕捉回归机会
      short_entry_multiplier: 1.0  # 保持中性

# v8.1: 自动 profile 选择（基于历史 d1 价差 Hurst 指数）
# enable=true 时, 对所有未显式声明 param_profile 的 sub 自动判定 profile.
# 也可在 strategies[].auto_profile=true 单独启用某个 sub 的 auto.
# Hurst > trend_hurst → trending_contract;  < mr_hurst → mr_contract;  否则 baseline
param_profile_auto:
  enable: true                     # v8.1 启用: 双合约 auto 判定 (rb_hc_2510→trending, rb_hc_2601→mr)
  trend_hurst: 0.55                # H > 0.55 判定趋势
  mr_hurst: 0.45                   # H < 0.45 判定均值回归
  trend_r2: 0.55                   # 线性趋势 R² > 0.55 → trending (绕过 Hurst, 防止单边强趋势被 Hurst 假性低估)
  lookback_days: 120               # 日线回看根数
  storage_csv_dir: ./storage/csv

strategies:
- legs:
  - code: SHFE.rb.2601
    lots: 1
    multiplier: 10
    ratio: 1
  - code: SHFE.hc.2601
    lots: 1
    multiplier: 10
    ratio: -1
  name: rb_hc_2601_m5
  auto_profile: true                # v8.1: 启用 auto, 由 Hurst 决定 profile
  periods:
    aux_periods:
    - bar_cnt: 15
      period: d1
    main_bar_cnt: 200
    main_period: m5
  signal_mode: adaptive
  spread_mode: coint
  type: cross_commodity

