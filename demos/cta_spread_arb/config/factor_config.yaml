signal_aggregation:
  # v8.1: direction_threshold 已移除（dead 参数）
  entry_threshold: 0.45  # v6: 从 0.65 降到 0.45, 配合因子瘦身后核心因子权重集中
  exit_threshold: 0.12
  method: weighted_sum
