# ============================================================
# factor_config.yaml — v6 因子瘦身 + ADX 修复版
# 改动:
#   1. 因子从 8 个瘦身到 3 个核心: coint_residual(0.5) + half_life(0.2) + spread_momentum(0.3)
#   2. 关停 zscore (与 coint_residual 共线性 > 0.8, 重复计票)
#   3. 关停 MACD/ADX/Channel/TrendStrength (套利价差为均值回归型, 趋势族信号干扰反转判断)
#   4. ADX 公式已修复(Wilder TR + DM 互斥规则, hl_window=2 合成OHLC), 保留实现但默认禁用
#   5. entry_threshold 同步降到 0.45 (配合因子瘦身后单因子权重提升)
# 逻辑:
#   - rb/hc 套利核心是 spread 均值回归, 协整残差是最强 alpha 信号
#   - half_life 给出回归时间尺度过滤
#   - spread_momentum 作为趋势对冲(避免在趋势中逆势抄底/抄顶)
# ============================================================

factors:
# === 均值回归核心因子(reversal) ===
- class: CointResidualFactor
  enabled: true
  name: coint_residual
  params:
    coint_p_threshold: 0.05
    lookback: 60
    refit_interval: 12
  weight: 0.5
- class: HalfLifeFactor
  enabled: true
  name: half_life
  params:
    lookback: 60
    max_half_life: 30
    min_half_life: 4
  weight: 0.2

# === 趋势对冲因子(momentum, 防止逆势进场) ===
- class: SpreadMomentumFactor
  enabled: true
  name: spread_momentum
  params:
    fast_period: 12
    slow_period: 60
  weight: 0.3

# === 关停因子(P4M-5: 已注释, 取消注释 + enabled:true 即恢复) ===
# 决策性关停: 趋势族(MACD/ADX/Channel/TrendStrength) + 量价族(Vwap/VPD/OBV/VolRatio) + RSI
# 统计性关停: ZScore (与 coint_residual 共线 > 0.8)
# 源码全保留于 factors/{stat,trend,vol_price,momentum}_factors.py + factors/__init__.py 导出
# ----- ZScore (统计性关停, 共线) -----
# - class: ZScoreFactor
