# ============================================================
# experiments/default.yaml — 默认实验/实例定义
# 用途: 声明本次回测/实盘的 instance × contract × profile 装配关系,
#       包含 backtest 段(回测区间/资金/滑点)与 auto_profile 全局开关。
# 说明:
#   v10: 单pipeline模式, 每个experiment只含1个instance。
#   多合约月份用多策略实例(多个experiment yaml或外部脚本循环)。
#   - 每个 instance 通过 contract 引用 contracts/*.yaml 模板
#   - contract_month 决定 stdCode 中的合约月份后缀
#   - auto_profile=true 时由 Hurst 自动选 profile, 否则可显式
#     设置 param_profile: trending_contract | mr_contract
# ============================================================

name: default
description: "rb/hc 跨品种套利 - 2510合约 auto profile"

backtest:
  start: 202501200900
  end: 202510151500
  capital: 1000000
  slippage: 0

# auto_profile 全局配置
auto_profile:
  enable: true
  trend_hurst: 0.55
  mr_hurst: 0.45
  trend_r2: 0.55
  lookback_days: 120
  storage_csv_dir: ./storage/csv

instances:
  - name: rb_hc_2510_m5
    contract: rb_hc
    contract_month: "2510"
    periods:
      main_period: m5
      main_bar_cnt: 200
      aux_periods:
        - period: d1
          bar_cnt: 15
    signal_mode: adaptive
    auto_profile: true
