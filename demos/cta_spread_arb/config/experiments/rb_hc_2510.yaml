# ============================================================
# experiments/rb_hc_2510.yaml — rb/hc 2510 (trending_contract) 实验
# P0-γ B方案验证: auto_profile 命中 trending_contract (R²=0.804)
# 数据范围: 2024/10/16 - 2025/10/15
# ============================================================

name: rb_hc_2510
description: "rb/hc 跨品种套利 - 2510合约 (trending profile)"

backtest:
  start: 202410160900
  end: 202510151500
  capital: 1000000
  slippage: 0

auto_profile:
  enable: true
  trend_hurst: 0.55
  mr_hurst: 0.45
  trend_r2: 0.55
  lookback_days: 120
  storage_csv_dir: ./storage/csv

instances:
  - name: rb_hc_2510_m5
    contract: rb_hc
    contract_month: "2510"
    periods:
      main_period: m5
      main_bar_cnt: 200
      aux_periods:
        - period: d1
          bar_cnt: 15
    signal_mode: adaptive
    auto_profile: true
